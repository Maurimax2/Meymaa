<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MOOR TV — الطلبات</title>
<link rel="icon" href="__LOGO_URI__">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#06070e;--panel:#0d1129;--line:rgba(255,255,255,.11);--blue:#2f6bff;
  --blue-2:#6ba2ff;--muted:rgba(255,255,255,.56);color-scheme:dark}
body{background:var(--ink);color:#f2f5ff;font-family:'Alexandria',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:26px 18px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
header img{width:34px;height:34px}
header b{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:23px;letter-spacing:.03em}
header b i{font-style:normal;color:var(--blue)}
header .sp{margin-inline-start:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;
  padding:0 18px;border-radius:3px;font-size:13.5px;font-weight:600;
  transition:background .2s,border-color .2s,color .2s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:#1d54d8}
.btn-l{border:1px solid var(--line)}
.btn-l:hover{background:#fff;color:var(--ink);border-color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.lock{max-width:400px;margin:12vh auto}
.lock h1{font-size:20px;margin-bottom:6px}
.lock p{font-size:13.5px;color:var(--muted);margin-bottom:18px}
input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:3px;
  background:var(--ink);margin-bottom:12px}
input[type=password]:focus{outline:none;border-color:var(--blue)}
.err{color:#ff6b5e;font-size:13px;min-height:20px}
.bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.bar h1{font-size:22px}
.bar span{font-size:13px;color:var(--muted)}
.list{display:grid;gap:12px}
.order{display:grid;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:18px}
@media(min-width:760px){.order{grid-template-columns:minmax(0,1fr) 190px}}
.order .ref{display:inline-flex;align-items:center;gap:8px;font-family:'Big Shoulders Display',sans-serif;
  font-weight:800;font-size:17px;letter-spacing:.08em;color:var(--blue-2)}
.order .when{font-size:12px;color:var(--muted)}
.order dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px}
.order dt{color:var(--muted)}
.order dd{font-weight:600;overflow-wrap:anywhere}
.order .amt{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px}
.order a.tel{color:var(--blue-2)}
.shot{position:relative}
.shot a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#04060e}
.shot img{width:100%;height:190px;object-fit:cover}
.shot .none{display:flex;align-items:center;justify-content:center;height:190px;
  border:1px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--muted);text-align:center;padding:14px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
.note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="__LOGO_URI__" alt=""><b>MOOR<i>TV</i></b>
    <div class="sp" id="tools" hidden>
      <button class="btn btn-l" id="reload">تحديث</button>
      <button class="btn btn-l" id="out">خروج</button>
    </div>
  </header>

  <div class="card lock" id="lock" hidden>
    <h1>الطلبات</h1>
    <p>أدخل مفتاح الدخول للاطّلاع على الطلبات وصور التأكيد.</p>
    <input type="password" id="key" autocomplete="current-password" placeholder="مفتاح الدخول">
    <button class="btn btn-p" style="width:100%" id="go">دخول</button>
    <p class="err" id="lockErr"></p>
  </div>

  <div id="panel" hidden>
    <div class="bar"><h1>الطلبات</h1><span id="count"></span></div>
    <div class="list" id="list"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
var PAY = { bankily:'بنكيلي', masrvi:'مصرفي', sedad:'السداد', click:'كليك' };
var $ = function (s) { return document.querySelector(s); };
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n){ return new Intl.NumberFormat('en-US').format(n||0) + ' MRU'; }
function when(iso){
  var d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleString('fr-FR', { dateStyle:'medium', timeStyle:'short' });
}

function show(which){
  $('#lock').hidden = which !== 'lock';
  $('#panel').hidden = which !== 'panel';
  $('#tools').hidden = which !== 'panel';
}

function render(orders){
  $('#count').textContent = orders.length + ' طلب';
  if (!orders.length){
    $('#list').innerHTML = '<div class="empty">لا توجد طلبات بعد.</div>';
    return;
  }
  $('#list').innerHTML = orders.map(function (o){
    var tel = String(o.phone||'').replace(/[^\d+]/g,'');
    return '<article class="order">'+
      '<div>'+
        '<span class="ref">'+esc(o.ref)+'</span> '+
        '<span class="when">'+esc(when(o.at))+'</span>'+
        '<dl>'+
          '<dt>الاسم</dt><dd>'+esc(o.name)+'</dd>'+
          '<dt>الهاتف</dt><dd><a class="tel" href="https://wa.me/'+
            (tel.length===8 ? '222'+tel : tel.replace(/^\+/,''))+
            '" target="_blank" rel="noopener" dir="ltr">'+esc(o.phone)+'</a></dd>'+
          '<dt>الاشتراك</dt><dd>'+esc(o.plan)+'</dd>'+
          '<dt>المبلغ</dt><dd class="amt" dir="ltr">'+esc(money(o.price))+'</dd>'+
          '<dt>الدفع</dt><dd>'+esc(PAY[o.pay]||o.pay||'—')+'</dd>'+
          '<dt>الجهاز</dt><dd>'+esc(o.device||'—')+'</dd>'+
          (o.notes ? '<dt>ملاحظات</dt><dd>'+esc(o.notes)+'</dd>' : '')+
        '</dl>'+
      '</div>'+
      '<div class="shot">'+ (o.proofPath
        ? '<a href="/api/proof?p='+encodeURIComponent(o.proofPath)+'" target="_blank" rel="noopener">'+
          '<img src="/api/proof?p='+encodeURIComponent(o.proofPath)+'" alt="تأكيد الدفع" loading="lazy"></a>'
        : '<div class="none">لا توجد صورة تأكيد</div>')+
      '</div>'+
    '</article>';
  }).join('');
}

function load(){
  return fetch('/api/orders', { credentials:'same-origin' }).then(function (r){
    if (r.status === 401) { show('lock'); return null; }
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (j){
    if (!j) return;
    show('panel');
    render(j.orders || []);
  }).catch(function (e){
    show('panel');
    $('#list').innerHTML = '<div class="empty">تعذّر تحميل الطلبات — ' + esc(e.message) +
      '<br>تأكد من إعداد التخزين ومفتاح الدخول على Vercel.</div>';
  });
}

$('#go').addEventListener('click', function (){
  var key = $('#key').value;
  $('#lockErr').textContent = '';
  fetch('/api/orders', { method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key: key })
  }).then(function (r){
    if (r.ok) { $('#key').value=''; return load(); }
    return r.json().catch(function(){ return {}; }).then(function (j){
      $('#lockErr').textContent = j.error === 'admin-key-not-set'
        ? 'لم يُضبط ADMIN_KEY على Vercel بعد.' : 'مفتاح غير صحيح.';
    });
  }).catch(function (){ $('#lockErr').textContent = 'تعذّر الاتصال بالخادم.'; });
});
$('#key').addEventListener('keydown', function (e){ if (e.key === 'Enter') $('#go').click(); });
$('#reload').addEventListener('click', load);
$('#out').addEventListener('click', function (){
  fetch('/api/orders', { method:'DELETE', credentials:'same-origin' })
    .then(function (){ show('lock'); });
});

load();
</script>
</body>
</html>
